baseURL = "https://signagelist.org/"
languageCode = "en-us"
title = "SignageList"
enableRobotsTXT = true
capitalizeListTitles = false
# Dates in content front matter carry no offset. Without this they are read as UTC, so a
# release note dated today and written after 20:00 local counts as future-dated and Hugo
# silently drops it from the build until UTC catches up.
timeZone = "Asia/Dubai"

[taxonomies]
  category = "categories"
  platform = "platforms"
  standard = "standards"

# Compliance standard pages live under /compliance/. The taxonomy can't be called
# "compliance" because products already use that key for their claim records.
[permalinks]
  [permalinks.taxonomy]
    standards = "/compliance/"
  [permalinks.term]
    standards = "/compliance/:slug/"

[params]
  description = "A curated directory of digital signage software products."
  githubRepo = "https://github.com/SignageList/signagelist"

# Custom output formats for LLM-friendly pages
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  # Markdown mirror of every page, for AI crawlers and agents that prefer
  # clean text over HTML. Linked from <link rel="alternate" type="text/markdown">.
  [outputFormats.md]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    permalinkable = false
    notAlternative = false
  # Whole-directory JSON dump at /products.json
  [outputFormats.productsjson]
    mediaType = "application/json"
    baseName = "products"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull", "productsjson", "md"]
  page = ["HTML", "md"]
  section = ["HTML", "RSS", "md"]
  taxonomy = ["HTML", "md"]
  term = ["HTML", "md"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[security]
  [security.http]
    urls = ['.*']
    methods = ['(?i)GET']

[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = '24h'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/inter/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
