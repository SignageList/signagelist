notes:
  - The vendor states the player has been tested only on the Android 12 emulator, with testing on real hardware pending. It was written for IMD's own Android panel-mount displays.
  - The player plays images and video from USB or microSD, with scheduling, rotation and an optional playlist sync from your own HTTPS server. It is a direct APK download, with no account needed.
  - IMD Signage Studio, a free Windows app, links screens with a one-time code and sends shows through a free IMD-hosted service. It is capped at 25 screens and 200 MB in total.
  - IMD Signage is the signage line of Industrial Monitor Direct in Sanford, Maine, which sells commercial displays.
