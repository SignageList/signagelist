notes:
  - Pricing is listed in EUR excluding VAT (Standard €7, Business €12 per screen per month) and in USD on the same page ($8 and $14).
  - Volume pricing applies automatically from five screens, falling to €5.25 per screen on Standard and €9 on Business at 100 or more.
  - Billing counts only the displays that were online that month, with no contract, setup fee, or minimum.
  - The free trial runs 14 days with no credit card.
  - The screen count combines the published Samkaup and Olís case studies, 350 or more screens across 80 or more locations.
