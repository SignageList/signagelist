notes:
  - Pricing is listed in EUR before tax (Premium €9 per screen per month or €99 per year, Lite €5 per device per month or €55 per year). Enterprise is custom quoted.
  - The Free plan covers up to 3 screens and 500 MB of media with no time limit and no credit card. A "Powered by Smart-Signage" badge appears after 30 days.
  - Lite licenses are only for secondary devices such as meeting room tablets, remote controls, e-paper labels, and secondary video wall tiles. Every broadcasting screen needs a Premium license.
  - Players are a web player (installable PWA), a signed Android APK with kiosk mode, a Windows app, and a native LG webOS Signage app. Raspberry Pi and Linux PCs run the web player in a browser in kiosk mode.
  - Samsung Tizen displays play through the web player in the built-in URL Launcher, which requires the Enterprise plan.
  - A REST API and webhooks exist, but access and technical documentation are provided on request as part of the Enterprise plan.
  - SSO is listed as an Enterprise feature on the pricing page, while the documentation describes it as planned and set up per customer.
  - The service is run by Smart-Live SAS, based in Oullins-Pierre-Bénite near Lyon, and is hosted on OVHcloud in France.
