notes:
  - The Free plan is permanent, needs no credit card, and includes 2 screens and 500 MB of storage. Pro is sized and priced on request.
  - There is no time-limited trial.
  - The Android player is an APK for Android TV and Google TV boxes, installed through the Downloader app. Fire TV is listed among the supported boxes.
  - A separate Android APK runs on holographic LED fans with Android 7 or later. The vendor offers to handle the factory setup of fans.
  - The Windows player is a kiosk app for Windows 10 and 11 built on WebView2, with auto-start, remote updates, and one device per attached monitor.
  - iPads and other devices without a native player use the browser player at matrixign.com/play, which can be added to the iPad home screen to run full screen.
  - Players cache content locally and keep playing offline. Features include multi-zone layouts on TV and Windows, proof-of-play reports per client and screen, per-client portals with content approval, and admin and technician roles.
  - The interface is available in English and Spanish.
