notes:
  - One plan at $12 per month covering unlimited displays, 50 GB of storage and 100-plus templates. Annual billing is advertised as not yet available.
  - The free trial runs 14 days with no credit card. After it ends, screens keep playing their existing content but cannot be changed until a payment method is added.
  - Playback runs in a browser on any display, which is the vendor's stated reason for requiring no dedicated hardware.
