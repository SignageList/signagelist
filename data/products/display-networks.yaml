notes:
  - Built by Web It Up! of Boston, Massachusetts. Version 1.0.0 shipped in September 2026.
  - The server runs on a Debian VPS with a domain (Nginx, MongoDB, Express). Displays run a Chromium kiosk set up by a script on Debian or Raspberry Pi OS.
  - A channel is a single web page or a list of MP4 URLs, and tag rules decide which displays show which channel. There is no hosted version.
