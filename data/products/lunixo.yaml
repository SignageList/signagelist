notes:
  - Pricing is not published. Licenses are billed monthly or yearly under the terms of use, and larger projects are quoted individually.
  - Test licenses and trial access are offered at Lunixo's discretion. A test license becomes billable once it is released for productive use.
  - The screen count is the roughly 5,000 active licenses reported by invidis in April 2026.
  - Supported player platforms are Android 9 or later, Linux x64, webOS 8.0 or later, Samsung Smart Signage on Tizen 6.5 or later, and Windows 11 IoT or Enterprise.
  - Linux players run Lunixo's own signage OS, installed from a USB stick, with watchdog recovery, filesystem encryption, atomic updates, and SSH remote maintenance.
  - Advertising features include share of voice, playout caps, fallback campaigns, weather-triggered delivery, and VAST or SSP connections to Vistar Media, Perion, SSP1, Pladway, adlocaite, and EISBACH.
  - Single sign-on works through Microsoft and Google accounts. SAML is not documented.
  - The Cloud API is documented with a Swagger reference. Linux players also expose a local HTTP API that is enabled on request.
