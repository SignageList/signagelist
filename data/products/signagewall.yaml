notes:
  - Pricing is listed in EUR. Basic is €8 per screen per month for up to 5 screens, shown as a launch price against a regular €12. Enterprise covers more than 5 screens and is quoted on request.
  - Every feature is included on both plans. Billing is a monthly invoice paid by bank transfer, with no card payment.
  - There is a 21-day free trial with no card required. There is no permanently free plan.
  - Players are native apps for Android 8.0 or newer, Windows 10 or newer, macOS 12 or newer, and Linux. The Android and desktop builds are not publicly downloadable yet and are sent on request.
  - The Partner API is read-only and covers screens, playback configuration, playlists, and media.
  - The dashboard supports signing in with a Google account. No enterprise SSO or SAML is documented.
