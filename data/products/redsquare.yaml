notes:
  - The app and the Screen Player are free with no subscription. RedSquare instead takes a share of paid bookings, with the screen owner keeping 60 percent of the screen-time price.
  - Every booking is free while the network is being grown. Paid ad time opens later with at least 30 days' notice.
  - Screens run today through the browser player at tv.redsquare.app or a desktop Screen Player. Apps for Fire TV, Android TV, Samsung, LG, Roku, and Apple TV are not yet published to their stores.
  - Screen owners approve what plays on their screen and set a price per 10-second play.
