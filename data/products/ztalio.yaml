notes:
  - Plans are priced by screen count, with storage and users scaling alongside. Annual billing includes two months free.
  - Screen analytics and the Studio editor start on Starter. Screen lock and the API, CLI and MCP interfaces start on Pro.
  - Samsung Tizen is listed on the site as coming rather than available, so it is not recorded as a supported platform.
  - The vendor, Cre8ive Innovations LLC, is in Irving, Texas, and rebranded the product to Ztalio in 2026.
