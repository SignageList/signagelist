notes:
  - Plans are storage tiers rather than screen counts. Every standard plan includes unlimited screens with no per-screen fee, from 50 MB free to 10 GB at $49.99 per month. Above 10 GB is quoted.
  - There is no trial clock. The free plan is permanent, and paid plans carry a 30-day money-back guarantee.
  - The player runs on Apple TV (tvOS 26.5 or later) connected to a landscape HDMI display. Content is downloaded and verified locally, so a prepared playlist keeps playing through a short internet outage.
  - Built and supported by one developer, Wes Walz. No company headquarters or founding year is published.
