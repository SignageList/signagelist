notes:
  - Tilecast is free software under AGPL-3.0. There is no paid plan or hosted service.
  - The server runs with Docker Compose on the operator's own hardware and stores content in PostgreSQL. Screens are managed in a browser-based app called Tilecast Studio.
  - The Android player ships as an APK for Android TV devices, including Fire TV and Google TV. The Linux player is an Electron AppImage for x86_64 computers with systemd and kiosk support. ARM Linux support is listed as in progress.
  - Players cache content and keep playing when the server or network is unavailable.
  - The REST API is documented in the repository with an OpenAPI file, and integration tokens and webhooks are available.
