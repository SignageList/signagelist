notes:
  - Pricing is listed in EUR. The hosted Linutop TV service is sold as a 12-month subscription at EUR 96, alongside a free one-month tier. The shop does not state whether a subscription covers one screen or several.
  - Linutop Kiosk, the on-device player, is free to download and is included in Linutop OS. Linutop TV adds central management of a screen network, in the cloud or on a private server.
  - Linutop OS is built on Ubuntu LTS for PCs and Raspbian for the Raspberry Pi. The OS itself is sold rather than open source, with web upgrades at EUR 39.
  - The vendor also sells its own fanless mini PC players, the Linutop XS and Linutop 6, from EUR 189 to EUR 339.
