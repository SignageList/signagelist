date: "2025-05-22"
title: "Samsung MagicINFO 9 Server patch bypass CVE-2025-4632 exploited, sometimes for Mirai"
location: "Global"
country: "Global"
sector: other
type: vulnerability
summary: "CVE-2025-4632 is a path traversal flaw in MagicINFO 9 Server that bypassed the August 2024 fix for CVE-2024-7399 and lets attackers write arbitrary files with SYSTEM authority. Attackers began exploiting it shortly after a public proof of concept appeared on April 30, 2025, in some cases to deploy the Mirai botnet. CISA added it to the KEV catalog on May 22, 2025, and Samsung fixed it in version 21.1052."
