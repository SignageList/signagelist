date: "2015-12"
title: "Brussels' largest electronic billboard hacked to show a troll-face image"
location: "Brussels, Belgium"
country: "Belgium"
sector: billboard
type: hijack
summary: "Hackers entered a building in Brussels, went up to the top floor and got into the computer that controlled what was described as Belgium's largest electronic billboard. They replaced a drinks advertisement with a troll-face image and the text 'Hi BXL'. Passers-by reportedly welcomed the stunt, but the Brussels municipality objected."
