date: "2019-09-29"
title: "Asics Auckland store screens show pornography for hours"
location: "Auckland, New Zealand"
country: "New Zealand"
sector: retail
type: hijack
summary: "Promotional screens above Asics' central Auckland store ran pornography on a Sunday morning in late September 2019 until staff switched them off around 10 a.m. Estimates of the run time range from two hours to nine. Asics blamed an unknown person who gained access to the screens, apologised, and contacted police and Netsafe, and police said no cybercrime report had been filed with them."
