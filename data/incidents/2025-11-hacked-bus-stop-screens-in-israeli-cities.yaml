date: "2025-11-26"
title: "Hacked bus stop screens in Israeli cities play Arabic audio and political messages"
location: "Ashdod, Ramat Gan and other Israeli cities"
country: "Israel"
sector: transit
type: hijack
summary: "Bus stop screens in several Israeli cities, including Ashdod and Ramat Gan, played Arabic music and spoken Arabic audio around 9 p.m. on November 26, 2025. Times of Israel reported that the messages included remixed audio from Abu Obeida and criticism of Netanyahu and Trump. The Transportation Ministry said a cyber incident was likely and gave no attribution."
