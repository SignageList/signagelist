summary: "LG published two CVEs for webOS Signage 6.0.0-56 on February 26, 2024: CVE-2024-1885, a code injection flaw that can let a remote attacker run code on the device, and CVE-2024-1886, a path traversal flaw rated 8.8 by NVD. Scores vary across databases for the first one. Databases I checked report no public exploit code for either."
