date: "2024-08-24"
title: "Seattle-Tacoma airport flight and baggage boards knocked out by Rhysida ransomware"
location: "Seattle, Washington, USA"
country: "United States"
sector: airport
type: ransomware
summary: "Flight and baggage display boards around Seattle-Tacoma International Airport were disrupted when a ransomware attack starting August 24, 2024 took down internet and web systems at the Port of Seattle. Staff used dry-erase boards into the Labor Day weekend. The Port later confirmed Rhysida as the attacker, rejected the ransom demand, and believed sensitive data had been exfiltrated."
