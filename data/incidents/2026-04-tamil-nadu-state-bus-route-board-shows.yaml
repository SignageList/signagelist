date: "2026-04"
title: "Tamil Nadu state bus route board shows a political party name instead of its route"
location: "Tamil Nadu, India"
country: "India"
sector: transit
type: hijack
summary: "The electronic route board on a Tamil Nadu State Transport Corporation bus showed a political party's name instead of route details, confusing passengers. The corporation said an inquiry found unidentified people had allegedly tampered with the display software and uploaded the content. It replaced the display unit's motherboard to restore route information and told the service provider running the signboards to prevent a repeat."
