date: "2026-08-12"
title: "Bass Highway traffic sign in Tasmania hijacked overnight to show a vulgar message"
location: "Bass Highway between Rocky Cape and Detention River, Tasmania"
country: "Australia"
sector: road sign
type: hijack
summary: "An electronic traffic sign on the Bass Highway in Tasmania's north-west was tampered with overnight on 11 to 12 August 2026 and showed an offensive insult aimed at passing motorists. Building Tasmania said it was a contractor's sign, reset to its intended message at 7.30am, and that the contractor would report any damage to police."
