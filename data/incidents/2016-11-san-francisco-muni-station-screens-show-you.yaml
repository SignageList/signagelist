date: "2016-11-26"
title: "San Francisco Muni station screens show 'You Hacked' message in ransomware attack"
location: "San Francisco, California, USA"
country: "USA"
sector: transit
type: ransomware
summary: "Ransomware hit San Francisco's Muni transit computer systems on 26 November 2016, and station screens displayed \"You Hacked, ALL Data Encrypted\". Fare gates were affected, and riders got free rides for the day. A person who may have spread the malware reportedly asked for $73,000."
