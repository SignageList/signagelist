date: "2025-10-14"
title: "Airport screens and PA systems in Canada and the US hijacked with pro-Hamas messages"
location: "Kelowna, Victoria and Windsor, Canada; Harrisburg, USA"
country: "Canada"
sector: airport
type: hijack
summary: "Intruders reached the terminal information screens and public address system at Kelowna International Airport around 5 p.m. on 14 October 2025. The messages said Hamas had won the war and insulted US President Donald Trump. Staff removed them within minutes, but the intrusion caused some flight delays, and the airport described the intruder only as an unauthorized third party. Similar intrusions were reported at other Canadian airports and at Harrisburg International Airport in Pennsylvania."
