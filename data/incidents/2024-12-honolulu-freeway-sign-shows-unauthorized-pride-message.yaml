summary: "On Sunday, December 29, 2024, drivers saw an unauthorized Pride-themed message on a sign on Moanalua Freeway (H-201). Hawaii DOT disabled the sign, planned to reset it with safety messaging, and began investigating how someone got access. KITV reported the case."
