date: "2018"
title: "Jacksonville stadium jumbotron hacked by former Jaguars contractor after firing"
location: "Jacksonville, Florida, USA"
country: "USA"
sector: stadium
type: hijack
summary: "Prosecutors say the stadium's jumbotron controls were hacked by a former contractor, a registered sex offender the Jaguars fired in January 2018, who installed remote access software on a spare server. The video boards malfunctioned repeatedly during three games that season. He was convicted in November 2023 and sentenced to 220 years in March 2024."
