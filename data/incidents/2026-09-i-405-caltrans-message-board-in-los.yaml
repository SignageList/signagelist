summary: "A temporary Caltrans sign near Westwood on the I-405 flashed the address of a website that exposes Iranian dissidents, first seen on September 8, 2026. Caltrans said the unit was used for the Sepulveda Pass pavement project. The LA Times reported that the site showed photos of Iranian protesters in the US and Canada, and no arrests were reported."
