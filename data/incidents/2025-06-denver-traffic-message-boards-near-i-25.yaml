title: "Denver traffic message boards near I-25 show profane anti-ICE message"
location: "Denver, Colorado, USA"
country: "USA"
sector: road sign
type: hijack
summary: "On a Sunday in June 2025, electronic traffic boards at the Broadway and I-25 interchange in Denver showed a profane anti-ICE message. Denver's transportation department said someone outside the contractor's team broke the lock on a controller panel and changed the message, and that only one board was hit. Social media users also reported the same message on East Colfax boards two days earlier."
