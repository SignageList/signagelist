date: "2017-05-29"
title: "Liverpool One shopping centre screen taken over to show a security warning"
location: "Liverpool, England, UK"
country: "United Kingdom"
sector: retail
type: hijack
summary: "A screen among the 18 digital displays run by Elonex at Liverpool One was taken over that weekend, around 29 May 2017, and showed a message about weak security, signed by \"friendly neighbourhood hackers\". The mall shut the screen down, and the operator called it good-natured. Security researcher Kevin Beaumont later posted images showing several screens still offline the next day, which the mall disputed, and the culprit was never identified."
