summary: "Geoffrey Eltgroth, 26, of central Texas, changed the construction warning on an electronic message board to read 'Drive Crazy Y'all.' He told investigators he guessed the sign's username and password and changed the message because he thought it was funny. He was arrested in May 2016, and the charge was reported differently across outlets."
