date: "2013-07"
title: "Kensington Parkway road sign in Maryland hacked to say Smoke Weed Evryday"
location: "Kensington, Maryland, USA"
country: "USA"
sector: road sign
type: hijack
summary: "A sign on Kensington Parkway that normally showed congestion and detour messages was hacked to read Smoke Weed Evryday. The sign belonged to D and F Construction, which was working for Montgomery County, and was deactivated and reprogrammed after the county police learned of the change."
