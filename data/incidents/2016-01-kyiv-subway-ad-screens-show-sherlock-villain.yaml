date: "2016-01-15"
title: "Kyiv subway ad screens show Sherlock villain Moriarty images"
location: "Kyiv, Ukraine"
country: "Ukraine"
sector: transit
type: hijack
summary: "Hackers replaced ad screens in Kyiv subway cars with images of Moriarty, the Sherlock Holmes villain, in January 2016. The metro's press service said it had not sanctioned the placement and was investigating. Coverage treated it as a playful stunt that still raised security questions."
