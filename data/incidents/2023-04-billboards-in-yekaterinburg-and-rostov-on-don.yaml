date: "2023-04-18"
title: "Billboards in Yekaterinburg and Rostov-on-Don show antiwar statements"
location: "Yekaterinburg and Rostov-on-Don, Russia"
country: "Russia"
sector: billboard
type: hijack
summary: "Billboards in Yekaterinburg and Rostov-on-Don showed statements attributed to mobilized soldiers criticizing the war in Ukraine. Security Lab reported that the billboards were compromised by hackers. No group took responsibility in the reports found, and attribution is unconfirmed."
