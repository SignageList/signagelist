date: "2015-08-12"
title: "All screens at Curitiba's Boqueirao bus station show pornographic videos"
location: "Curitiba, Brazil"
country: "Brazil"
sector: transit
type: hijack
summary: "Pornographic videos ran for about 15 minutes on every screen at the Boqueirao bus station in Curitiba during Friday afternoon peak hours in August 2015. One account says the attackers replaced arrival and departure times with adult content. Police cyber crime staff tried to trace the attackers, and the company operating the screens was told to improve its security."
