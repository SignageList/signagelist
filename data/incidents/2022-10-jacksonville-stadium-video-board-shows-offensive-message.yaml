summary: "An offensive message referencing Ye, formerly Kanye West, appeared on the exterior video board at TIAA Bank Field after the Florida-Georgia game. The two universities issued a joint statement condemning it. Jacksonville police and the FBI investigated, and reporting said the message appears to have been projected from outside the stadium."
