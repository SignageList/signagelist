date: "2018-09-14"
title: "Bristol Airport flight screens go dark after ransomware infection"
location: "Bristol, United Kingdom"
country: "United Kingdom"
sector: airport
type: ransomware
summary: "Ransomware infected the computers that drive Bristol Airport's in-house screens showing arrival and departure information on 14 September 2018, and the screens stayed dark for about two days. Staff used handwritten whiteboards and extra PA announcements. The airport said flights were not affected, that it would not pay the ransom, and the ransomware variant was never publicly identified."
