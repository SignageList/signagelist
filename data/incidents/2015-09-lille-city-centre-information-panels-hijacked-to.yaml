date: "2015-09"
title: "Lille city centre information panels hijacked to show crude messages"
location: "Lille, France"
country: "France"
sector: other
type: hijack
summary: "A hacker took over the information panels in Lille city centre in late summer 2015 and displayed crude messages. He cut the display after about 10 seconds, long enough to film a video, and said he had no political motive."
