date: "2019-09-28"
title: "I-75 billboard in Auburn Hills shows pornographic video after two people hacked it"
location: "Auburn Hills, Michigan, USA"
country: "United States"
sector: billboard
type: hijack
summary: "On the night of September 28, 2019, a pornographic video played on a northbound I-75 digital billboard in Auburn Hills, Michigan, for an estimated 15 to 30 minutes. Police said two people broke into an unstaffed shed under the billboard and hacked a computer inside, and the operator stopped the video remotely. One later report said two teenagers were charged after video of the break-in was reviewed, though only one source mentions this."
