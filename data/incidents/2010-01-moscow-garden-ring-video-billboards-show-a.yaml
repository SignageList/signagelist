date: "2010-01"
title: "Moscow Garden Ring video billboards show a pornographic clip, halting traffic"
location: "Moscow, Russia"
country: "Russia"
sector: billboard
type: hijack
summary: "A pornographic clip played on video billboards along Moscow's Garden Ring Road in mid-January 2010, halting traffic as drivers and pedestrians filmed it. Police identified Igor Blinnikov, 41, who said he broke into the server of the ad agency that ran the billboards and picked a random video; he called it a joke that went wrong. Sentence reports conflict, with one saying 18 months and another six years, and the incident led the Moscow Advertising Committee to ban video billboards on city streets."
