date: "2016-07"
title: "Digital advertising screens in Brussels hacked to show anti-TTIP messages"
location: "Brussels, Belgium"
country: "Belgium"
sector: billboard
type: hijack
summary: "Several electronic advertising screens in Brussels were hacked during the 14th round of TTIP negotiations in July 2016, and anti-TTIP messages were left on them. A large Coca-Cola screen was among those manipulated, and the action was reported at the Place de Brouckere."
