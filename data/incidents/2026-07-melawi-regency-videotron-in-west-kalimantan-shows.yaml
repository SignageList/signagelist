date: "2026-07"
title: "Melawi regency videotron in West Kalimantan shows obscene video"
location: "Melawi, West Kalimantan, Indonesia"
country: "Indonesia"
sector: billboard
type: hijack
summary: "An obscene video played on a public videotron on the Tugu Naruto route in Nanga Pinoh, Melawi, on 27 July 2026 and spread widely on social media. Melawi's Diskominfo said the management credentials for the screens were changed, and the regency government apologized. A joint investigation was still underway with no suspect reported at the time of the coverage."
