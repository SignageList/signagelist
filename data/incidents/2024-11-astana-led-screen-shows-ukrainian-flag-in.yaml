date: "2024-11-27"
title: "Astana LED screen shows Ukrainian flag in place of Russian one during Putin visit"
location: "Astana, Kazakhstan"
country: "Kazakhstan"
sector: billboard
type: hijack
summary: "On 27 November 2024, a street LED screen outside the Astana Opera showed the Ukrainian flag instead of the Russian one during Vladimir Putin's visit. The State Technical Service said the image was changed through proxy servers, while the screen owner blamed a cable short, and the Interior Ministry opened a criminal case."
