date: "2016-09-30"
title: "South Jakarta roadside LED screen plays pornographic video at rush hour"
location: "Jakarta, Indonesia"
country: "Indonesia"
sector: billboard
type: hijack
summary: "A pornographic video played for several minutes on a roadside LED screen in South Jakarta during afternoon rush hour in September 2016, and officials cut its power. Police arrested a 24-year-old IT worker who said he had photographed the screen's login and password, though police could not find that photo on his phone and the operator's account conflicted with his, so the story is unverified. He faced up to six years under the criminal code and the electronic information law."
