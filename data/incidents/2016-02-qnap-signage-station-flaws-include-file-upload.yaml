date: "2016-02-27"
title: "QNAP Signage Station flaws include file upload and authentication bypass"
location: "Global"
country: "Global"
sector: vendor
type: vulnerability
summary: "NVD published 4 vulnerabilities in QNAP Signage Station, covering file upload, authentication bypass, hard-coded credentials and privilege escalation. Unrestricted file upload vulnerability in QNAP Signage Station before 2.0.1 allows remote authenticated users to execute arbitrary code by uploading an executable file, and then accessing this file via an unspecified URL."
