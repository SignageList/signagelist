date: "2026-02"
title: "Karachi DHA digital ad screens show an obscene video, police arrest an employee"
location: "Karachi, Pakistan"
country: "Pakistan"
sector: billboard
type: insider
summary: "An obscene video played on digital advertising screens along Khayaban-e-Ittehad in Karachi's DHA area, prompting protests and a temporary shutdown of screens on several roads. Police arrested a company employee who said he had mistakenly played a video stored on his phone, while the company suspected someone had accessed the system without authorisation. A case was registered under Section 292 of the Pakistan Penal Code."
