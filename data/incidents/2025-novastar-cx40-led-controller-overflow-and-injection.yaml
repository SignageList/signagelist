type: vulnerability
summary: "NovaStar CX40 4K LED controllers at version 2.44.0 and earlier have a stack-based overflow in the NetFilter Utility's netconfig handling (CVE-2025-3007, rated critical). The same utility has a command injection flaw (CVE-2025-3008). Neither had public proof-of-concept code when the database entries were captured."
