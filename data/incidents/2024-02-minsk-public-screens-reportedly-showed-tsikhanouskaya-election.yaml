summary: "Screens in Minsk shopping centers, supermarkets and metro stations reportedly showed a speech by opposition leader Svyatlana Tsikhanouskaya on the eve of parliamentary and local elections. The number of screens was given as more than 2,000, a figure that could not be verified. The company that maintains the screens denied placing the address."
