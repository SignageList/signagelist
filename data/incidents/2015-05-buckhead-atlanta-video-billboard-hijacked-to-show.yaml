date: "2015-05"
title: "Buckhead, Atlanta video billboard hijacked to show a sexually explicit image"
location: "Atlanta, Georgia, USA"
country: "United States"
sector: billboard
type: hijack
summary: "A video billboard at Peachtree and East Paces Ferry Road in the Buckhead district of Atlanta showed a sexually explicit image of a naked man in May 2015. Police first considered an insider prank, then concluded someone had hacked the board from outside over the internet, and cut power to stop the image. The FBI also investigated the incident."
