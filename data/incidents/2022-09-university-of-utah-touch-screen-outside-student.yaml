date: "2022-09-11"
title: "University of Utah touch screen outside Student Life Center shows pornographic sites"
location: "Salt Lake City, Utah, USA"
country: "United States"
sector: education
type: hijack
summary: "A touch-screen kiosk outside the Student Life Center was compromised around midnight on September 11 and showed multiple pornographic sites over about two days. An employee noticed and reported it, and the kiosk was shut down within the hour. Campus police reviewed surveillance footage, and the university said its other 19 outdoor and about 100 indoor screens were not affected. No arrest is reported in the sources."
