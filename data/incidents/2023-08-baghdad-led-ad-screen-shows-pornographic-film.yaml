date: "2023-08-20"
title: "Baghdad LED ad screen shows pornographic film, prompting a citywide screen shutdown"
location: "Baghdad, Iraq"
country: "Iraq"
sector: billboard
type: hijack
summary: "A hacker played a pornographic film for several minutes on an LED advertising screen at Uqba bin Nafia Square in Baghdad in August 2023 before the power cable was cut. The interior ministry switched off all screens in the city and set up a committee to investigate. Police arrested the suspect, identified as Karar Hussein, about nine hours later, and he reportedly confessed and blamed a money dispute with the agency that ran the screens."
