date: "2024-10-16"
title: "Two Northbrook, Illinois digital billboards hacked with anti-Israel messages"
location: "Northbrook, Illinois, USA"
country: "United States"
sector: billboard
type: hijack
summary: "Two electronic billboards in Northbrook were hacked around 5:30 p.m. on October 16, 2024. They showed a Palestinian flag, anti-Israel slogans and a false line saying MrBeast LLC paid for them. Outfront Media, which owns the signs, shut them off and said the copy was not approved and that the signs were hacked. MrBeast's representative said he did not pay for the ad, and police were investigating with no group claiming responsibility in reports found."
