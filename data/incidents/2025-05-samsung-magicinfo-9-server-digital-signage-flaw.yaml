date: "2025-05-06"
title: "Samsung MagicINFO 9 Server digital signage flaw exploited by Mirai botnet"
location: "Global"
country: "Global"
sector: other
type: vulnerability
summary: "Mirai variants exploited CVE-2024-7399, a path traversal and file upload flaw in on-premise Samsung MagicINFO 9 Server, shortly after a public proof of concept appeared. Arctic Wolf and SANS reported the activity, and Huntress found version 21.1050 still vulnerable to the PoC. Help Net Security reported that a follow-on flaw, CVE-2025-4632, was the one seen in later attacks, and MagicInfo Cloud and VXT customers were not affected."
