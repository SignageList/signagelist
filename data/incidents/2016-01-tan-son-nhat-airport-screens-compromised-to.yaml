date: "2016-01-13"
title: "Tan Son Nhat airport screens compromised to show inappropriate content"
location: "Ho Chi Minh City, Vietnam"
country: "Vietnam"
sector: airport
type: hijack
summary: "A group of hackers compromised the display system at Tan Son Nhat International Airport in January 2016, according to an airport manager quoted by Tuoi Tre. Inappropriate content appeared on the screens that normally show flight information and advertising. This was an earlier incident than the July 2016 attack on Vietnamese airports."
