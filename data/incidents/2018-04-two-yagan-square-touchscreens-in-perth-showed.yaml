date: "2018-04"
title: "Two Yagan Square touchscreens in Perth showed the Pornhub homepage"
location: "Perth, Australia"
country: "Australia"
sector: other
type: hijack
summary: "Two touchscreen wayfinding signs at the William Street Mall entrances of Yagan Square in Perth showed the Pornhub homepage in April 2018 and stayed that way for about an hour. The operator, the Metropolitan Redevelopment Authority, first blamed a software fault that left the browser unlocked, then said content had been manually loaded, and it switched both displays off. Reporting differed on whether this was a hack, and no outcome of an investigation was published."
