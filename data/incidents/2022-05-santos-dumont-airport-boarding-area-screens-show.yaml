date: "2022-05-27"
title: "Santos Dumont airport boarding-area screens show adult clips"
location: "Rio de Janeiro, Brazil"
country: "Brazil"
sector: airport
type: hijack
summary: "Advertising screens in the boarding area of Rio de Janeiro's Santos Dumont airport showed clips from an adult site instead of ads on May 27, 2022. Infraero, which runs the airport, said the screens belonged to outside advertising companies, that its flight information systems were unaffected, and that it switched the screens off and notified the Federal Police. Passengers reacted with laughter, and some objected because children were traveling."
