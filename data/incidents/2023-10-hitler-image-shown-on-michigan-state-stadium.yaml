date: "2023-10-22"
title: "Hitler image shown on Michigan State stadium video board before football game"
location: "East Lansing, Michigan, USA"
country: "United States"
sector: stadium
type: insider
summary: "A Hitler image appeared on the stadium video board during a pregame trivia segment at Michigan State. The university said the content came from a third party, and it suspended an employee with pay pending an investigation. Coverage did not establish how the content reached the board."
