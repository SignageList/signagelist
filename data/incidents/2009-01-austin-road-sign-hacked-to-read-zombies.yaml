date: "2009-01-29"
title: "Austin road sign hacked to read 'Zombies Ahead'"
location: "Austin, Texas, USA"
country: "United States"
sector: road sign
type: hijack
summary: "A changeable road sign at Lamar and MLK in Austin showed 'Zombies Ahead' one morning in January 2009 in place of its normal construction warning. The city owns the sign, and TxDOT said its own signs were not affected. A hacking site linked to the prank featured the same message."
