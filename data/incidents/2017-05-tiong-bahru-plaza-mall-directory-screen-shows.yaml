date: "2017-05-13"
title: "Tiong Bahru Plaza mall directory screen shows WannaCry ransomware message"
location: "Singapore"
country: "Singapore"
sector: retail
type: ransomware
summary: "A ransomware message appeared on the digital directory at Tiong Bahru Plaza on Saturday 13 May 2017, photographed by a shopper and posted to Reddit and Facebook. The directory operator, MediaOnline, disconnected the boards while it installed a patch, and said the directory ran on its own network, not the malls' or tenants' networks. Reports also said screens at White Sands and a Desigual store at Orchard Central were hit."
products:
  - "MediaOnline digital directory"
