date: "2014-05"
title: "Van Ness Avenue traffic sign in San Francisco hacked to warn of a Godzilla attack"
location: "San Francisco, California"
country: "USA"
sector: road sign
type: hijack
summary: "A mobile electronic traffic sign on Van Ness Avenue was altered to warn drivers of a \"Godzilla Attack\" and to turn back. The sign was meant to carry Bay to Breakers traffic notices, and a Twitter user suggested the hacker had used default passcodes."
