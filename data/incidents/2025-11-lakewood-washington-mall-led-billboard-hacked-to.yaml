summary: "The mall's LED billboard, normally used for store ads, showed memes and doctored images of Charlie Kirk for six or seven hours on a Tuesday evening in November 2025. Police said someone with an agenda was responsible, the sign was shut down, and the owner worked with its vendor to prevent a repeat."
