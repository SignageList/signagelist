date: "2016-07-29"
title: "Flight screens and PA systems at two Vietnam airports hijacked with political messages"
location: "Ho Chi Minh City and Hanoi, Vietnam"
country: "Vietnam"
sector: airport
type: hijack
summary: "Hackers took over flight information screens and public address systems at Tan Son Nhat (Ho Chi Minh City) and Noi Bai (Hanoi) airports on 29 July 2016. The screens showed political messages tied to the South China Sea dispute instead of schedules, and the Vietnam Airlines website was defaced. Vietnamese authorities said flight operations and security systems were unaffected and ordered tighter aviation security."
