date: "2016"
title: "Shop-window monitors at a Munich pharmacy show pornographic video"
location: "Munich, Germany"
country: "Germany"
sector: retail
type: hijack
summary: "Pornographic video ran at night on three monitors in the shop window of the Cleemann pharmacy in Munich during the Oktoberfest period, and the pharmacy owner filed a complaint. According to the reporting, the attacker logged in with credentials that were shown on screen between ad spots and then changed the content remotely."
