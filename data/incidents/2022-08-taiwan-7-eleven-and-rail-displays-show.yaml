date: "2022-08"
title: "Taiwan 7-Eleven and rail displays show political message after contractor breach"
location: "Taiwan"
country: "Taiwan"
sector: retail
type: hijack
summary: "Hackers showed a political message on digital signs at 7-Eleven stores and on railway displays in Taiwan. Investigators said the server of the chain's signage contractor had been compromised, and reports said some 6,000 stores may have been affected."
