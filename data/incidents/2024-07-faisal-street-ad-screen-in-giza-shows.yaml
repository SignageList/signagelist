date: "2024-07-14"
title: "Faisal Street ad screen in Giza shows video criticizing Sisi"
location: "Giza, Egypt"
country: "Egypt"
sector: billboard
type: hijack
summary: "On the evening of 14 July 2024 a screen on Faisal Street in Giza showed altered images and a slideshow criticizing President Abdel Fattah al-Sisi. Police questioned several people and later said they had arrested a screen technician, though a rights lawyer disputed that this person was the one responsible. The Interior Ministry said it had apprehended the source of the content."
