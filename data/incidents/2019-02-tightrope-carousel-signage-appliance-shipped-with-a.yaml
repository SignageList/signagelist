date: "2019-02-11"
title: "Tightrope Carousel signage appliance shipped with a default admin login"
location: "Global"
country: "Global"
sector: vendor
type: research
summary: "Researcher Drew Green found that the Tightrope Media Carousel Seneca HDn signage appliance, version 7.0.4.104, shipped with a default local admin username and password that was still in use on a client system. He used that access and a bulletin upload feature to reach remote code execution, and also reported a privilege escalation path to SYSTEM. He reported the issues to Tightrope in November 2018, published about 90 days later, and used Shodan to estimate exposed installations, though the search count is not in the excerpt available; Tightrope published a knowledgebase article with workarounds."
