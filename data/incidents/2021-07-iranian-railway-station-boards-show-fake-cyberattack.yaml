date: "2021-07-09"
title: "Iranian railway station boards show fake cyberattack delay and cancellation notices"
location: "Nationwide, Iran"
country: "Iran"
sector: rail
type: hijack
summary: "On a Friday in July 2021, hackers posted fake messages on passenger display boards at stations across Iran saying trains were delayed by a cyberattack or cancelled, and listed a phone number for the office of the supreme leader. The state railway spokesman said trains ran normally and that there was no disruption, while Fars reported \"unprecedented chaos\" before removing the report. No group claimed responsibility."
