summary: "NVD published three vulnerabilities in BrightSign players, covering cross-site scripting, a security flaw and path traversal. The BrightSign Digital Signage (4k242) player, firmware 6.2.63 and below, has XSS via the REF parameter to /network_diagnostics.html or /storage_info.html."
