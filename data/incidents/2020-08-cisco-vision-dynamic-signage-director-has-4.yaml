summary: "NVD published 4 vulnerabilities in Cisco Vision Dynamic Signage Director, covering security flaw, privilege escalation, path traversal and cross-site scripting. A vulnerability in the web-based management interface of Cisco Vision Dynamic Signage Director could allow an unauthenticated, remote attacker to view potentially sensitive information on an affected device."
