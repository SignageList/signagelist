date: "2026-03-12"
title: "Israel Railways information screens show fake Iranian missile warnings"
location: "Several Israel Railways stations, Israel"
country: "Israel"
sector: rail
type: hijack
summary: "Advertising and information screens at several Israel Railways stations showed warnings of an incoming Iranian missile attack and told travelers to evacuate to shelters. One message read, \"The subway is not safe at the moment.\" The screens were shut down temporarily, and no group was blamed while an investigation was opened."
