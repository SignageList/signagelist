summary: "NVD published 4 vulnerabilities in SpinetiX Fusion, covering path traversal, CSRF, information disclosure and username enumeration. In SpinetiX Fusion Digital Signage 3.4.8 and lower, an authenticated path traversal flaw lets attackers manipulate file backup and deletion operations through unverified input parameters."
