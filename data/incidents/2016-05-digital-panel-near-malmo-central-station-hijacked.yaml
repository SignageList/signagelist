date: "2016-05-09"
title: "Digital panel near Malmo central station hijacked to show pornographic clips"
location: "Malmo, Sweden"
country: "Sweden"
sector: transit
type: hijack
summary: "A digital information panel near Malmo central station showed several clips from the Meatspin porn site at once around 15:47 in May 2016, and bystanders said they ran for at least 10 to 15 minutes. The screen was run by Global Agencies for the City of Malmo, which said it started an investigation. Reports differ on whether the device was a city panel at a bus stop or a street sign, and no one was reported arrested."
