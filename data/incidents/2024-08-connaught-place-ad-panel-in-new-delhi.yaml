date: "2024-08-23"
title: "Connaught Place ad panel in New Delhi shows pornographic video after hack"
location: "New Delhi, India"
country: "India"
sector: billboard
type: hijack
summary: "A municipal ad panel at Connaught Place in New Delhi started showing a pornographic video at about 10:30 p.m. on 23 August 2024. Passers-by filmed it and gave the footage to police, who registered a case under the IT Act. The panel is managed by the New Delhi Municipal Council, and the hacking was later confirmed."
