summary: "NVD published 4 vulnerabilities in EIBIZ i-Media Server, covering privilege escalation, path traversal, authentication bypass and insecure object references. In Eibiz i-Media Server Digital Signage 3.8.0, an unauthenticated privilege escalation flaw in the updateUser object lets attackers modify user roles."
