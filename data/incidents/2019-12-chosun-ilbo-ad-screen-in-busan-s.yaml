date: "2019-12-14"
title: "Chosun Ilbo ad screen in Busan's Seomyeon shows a mocking message"
location: "Seomyeon, Busan, South Korea"
country: "South Korea"
sector: billboard
type: hijack
summary: "On 14 December 2019 an outdoor ad screen in Seomyeon, Busan, operated for Chosun Ilbo, showed a message mocking the newspaper. The operator halted the screen for an internal review. Police arrested a teenager in December 2020, a year later, and charged him under the Information and Communications Network Act."
