summary: "A digital billboard on Elmwood Drive in Moncton showed a profane anti-Israel message and a Palestinian flag on Wednesday, October 16, 2024. The operator, Pattison Outdoor, called it a malicious hack by an outside party and said it was the only one of its billboards affected, and the local police reported no suspects."
